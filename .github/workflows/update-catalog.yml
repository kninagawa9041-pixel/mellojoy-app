
name: Update Mellojoy product catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch public product catalog
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = 'https://www.mellojoyjapan.com/products.json?limit=250'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/json',
              'User-Agent': 'MellojoyCatalogChecker/1.0'
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          products = []
          for p in data.get('products', []):
              variants = p.get('variants', [])
              products.append({
                  'id': str(p.get('id', '')),
                  'title': p.get('title', ''),
                  'handle': p.get('handle', ''),
                  'available': any(v.get('available') is True for v in variants),
                  'variants': [
                      {'available': v.get('available') is True, 'price': str(v.get('price', ''))}
                      for v in variants
                  ],
                  'price': str(variants[0].get('price', '')) if variants else ''
              })

          output = {
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'source': url,
              'products': products
          }
          with open('catalog.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, separators=(',', ':'))
          print(f"Saved {len(products)} products")
          PY

      - name: Commit catalog when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          if git diff --cached --quiet; then
            echo 'Catalog unchanged; no commit needed.'
          else
            git commit -m 'Update Mellojoy product catalog'
            git push
          fi
